[package]
name = "upstat"
version = "0.1.0"
description = "Upstat — uptime monitoring, incidents and status pages (desktop app)"
authors = ["Cuesoft Inc."]
license = "MIT"
repository = "https://github.com/cuesoftinc/upstat"
edition = "2024"
rust-version = "1.90"

[lib]
name = "upstat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
