  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2024"/>
      <stop offset="1" stop-color="#0e1113"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00e09e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00e09e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- macOS icon grid: 824px squircle-ish tile inset 100px -->
