syntax = "proto3";

package proto;

option go_package = "github.com/cuesoftinc/upstat/api/common/internal/proto";

import "insight.proto";

service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc GoogleAuth(GoogleAuthRequest) returns (GetUserResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc GetAllUsers(Empty) returns (GetAllUsersResponse);
}


service MonitorService{
   rpc CreateMonitor(CreateMonitorRequest) returns (MonitorResponse);
   rpc UpdateMonitor(UpdateMonitorRequest) returns (MonitorResponse);
   rpc GetMonitor(GetMonitorRequest) returns (MonitorResponse);
   rpc ListMonitors(ListMonitorsRequest) returns (ListMonitorsResponse);
   rpc DeleteMonitor(DeleteMonitorRequest) returns (DeleteMonitorResponse);
   rpc GetStatusPage(GetStatusPageRequest) returns (GetStatusPageResponse);
   rpc GetRecentChecks(GetRecentChecksRequest) returns (GetRecentChecksResponse);
   rpc GetMonitorHistory(GetMonitorHistoryRequest) returns (GetMonitorHistoryResponse);
   rpc GetMonitorInsight(GetMonitorInsightRequest) returns (GetMonitorInsightResponse);
   rpc ListIncidents(ListIncidentsRequest) returns (ListIncidentsResponse);
}

message GetStatusPageRequest{
 string owner_id = 1;
 // Optional: resolve the page by its public slug (StatusPage doc) instead of
 // an explicit owner_id. At most one of owner_id/slug is expected.
 string slug = 2;
}

message GetStatusPageResponse {
  repeated Monitor monitors = 1;
  repeated Incident active_incidents = 2;
  repeated Incident historical_incidents = 3;
  double uptime_percentage = 4;
  int64 total_checks = 5;
  int64 successful_checks = 6;
  // Public page identity (StatusPage document) — empty when the caller
  // resolved the page by owner_id instead of the public slug.
  string page_name = 7;
  // Per-monitor series the public status page renders (90-day strip + uptime
  // + latency). Computed from the same persisted CheckResult data as
  // GetMonitorHistory — never a second metrics system.
  repeated StatusPageComponent components = 8;
}

// One status-page component row: a monitor's public display name, its current
// status, and its trailing uptime series.
message StatusPageComponent {
  string monitor_id = 1;
  string name = 2;
  string status = 3;
  bool has_uptime = 4;
  double uptime_pct = 5;
  int64 last_response_time_ms = 6;
  repeated MonitorUptimeDay days = 7;
  // Observed p95 response time over the same window as `days` (10ms bucket
  // resolution) — the SAME source the uptime pillar shows, so the status page
  // and the dashboard cannot disagree.
  int64 p95_ms = 8;
  // ISO-8601 timestamp of the monitor's last executed check; empty when the
  // monitor has never been checked.
  string last_check_at = 9;
}

message GetRecentChecksRequest{
  string monitor_id = 1;
  int32 limit = 2;
}

message MonitorCheck {
  string monitor_id = 1;
  bool success = 2;
  int32 response_time = 3;
  int32 status_code = 4;
  string checked_at =5;
}

message GetRecentChecksResponse{
   repeated MonitorCheck checks = 1;
}

message Incident {
  string id = 1;
  string monitor_id = 2;
  string title = 3;
  string failure_reason = 4;
  string status = 5;
  string started_at = 6;
  string resolved_at = 7;
  int64 duration_seconds = 8;
}

message Monitor{
  string id = 1;
  string owner_id = 2;
  string name = 3;
  string type = 4;
  string target = 5; 
  string created_at = 6;
  string updated_at = 7;
  bool active = 8;
  string status = 9;
  int32 interval_seconds = 10;
  int32 timeout_seconds = 11;
  int32 failure_threshold = 12;
  int32 consecutive_failures = 13;
  string last_checked_at = 14;
  int64 last_response_time_ms = 15;
  int32 last_status_code = 16;
  // Muted monitors suppress alert/notification dispatch (UI state only;
  // never exposed over the public status page).
  bool muted = 17;
}

message CreateMonitorRequest{
  string name = 1;
  string type = 2;
  string target = 3;
  int32 interval_seconds = 4;
  int32 timeout_seconds = 5;
  int32 failure_threshold = 6;
}

message UpdateMonitorRequest{
  string id = 1;
  string name = 2;
  string type = 3;
  string target = 4;
  optional bool active = 5;
  optional bool muted = 6;
  optional int32 interval_seconds = 7;
  optional int32 timeout_seconds = 8;
  optional int32 failure_threshold = 9;
}

message GetMonitorRequest{
  string id = 1;
}

message MonitorResponse{
  Monitor monitor = 1;
  string Status = 2;
}

message DeleteMonitorRequest{
   string id = 1;
}

message DeleteMonitorResponse{
   string data = 1;
   string Status = 2;
}

message ListMonitorsRequest{}

message ListMonitorsResponse{
   repeated Monitor monitors = 1;
}



message GetUserRequest {
  string email = 1;
  string password = 2;
}

message GoogleAuthRequest {
  string id_token = 1;
}

message GetUserResponse {
  string id = 1;
  string name = 2;
  string email = 3;
  string token = 4;
  string status = 5;
  string data = 6;
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
  string password = 3;
}

message CreateUserResponse {
  string data = 1;
  string status = 2;
}

message UpdateUserRequest {
  string id = 1;
  string name = 2;
  string email = 3;
  string password = 4;
}

message UpdateUserResponse {
  string data = 1;
  string status = 2;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {
  string data = 1;
  string status = 2;
}

message Empty {}

message GetAllUsersResponse {
  repeated GetUserResponse users = 1;
}

// GetMonitorHistory — authenticated per-monitor read for the uptime vertical:
// recent raw checks plus a per-day uptime aggregation computed from the
// persisted CheckResult data (the same source the rollup worker aggregates).
message GetMonitorHistoryRequest {
  string monitor_id = 1;
  // Number of trailing days to aggregate (default 90, max 90).
  int32 days = 2;
  // Recent raw checks limit (default 100, max 500).
  int32 limit = 3;
}

// One per-day bucket in the uptime strip. has_data=false marks a no-data
// (nodata) day — check data simply doesn't exist yet for that bucket.
message MonitorUptimeDay {
  bool has_data = 1;
  string date = 2;   // YYYY-MM-DD in UTC
  double uptime_pct = 3;   // 0..100 when has_data
  int64 down_minutes = 4;  // minutes where the monitor was not "up"
}

message GetMonitorHistoryResponse {
  repeated MonitorCheck recent_checks = 1;
  repeated MonitorUptimeDay days = 2;
  // Rolling 90-day uptime percentage; 0 when has_uptime is false.
  double overall_uptime_pct = 3;
  bool has_uptime = 4;
}

// ListIncidents — authenticated read scoped to the caller's own monitors.
// Empty monitor_id lists incidents across all of the caller's monitors.
message ListIncidentsRequest {
  string monitor_id = 1;
}

message ListIncidentsResponse {
  repeated Incident incidents = 1;
}
